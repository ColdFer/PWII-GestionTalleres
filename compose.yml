services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taller_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - taller_network

    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:alpine

    container_name: taller_web

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - taller_network

    depends_on:
      - app

  database:
    image: mysql:8

    container_name: taller_database

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - taller_mysql_data:/var/lib/mysql

    networks:
      - taller_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  taller_network:
    driver: bridge

volumes:
  taller_mysql_data: